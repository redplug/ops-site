services:
  ops-site:
    build:
      context: .
      dockerfile: Dockerfile
    image: ops-site:latest
    container_name: ops-site
    restart: unless-stopped
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ops-site-data:/app/data

volumes:
  ops-site-data:
